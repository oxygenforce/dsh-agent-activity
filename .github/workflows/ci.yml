name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Manifest and contract checks
        run: node scripts/check-manifest.mjs
      - name: Syntax
        run: |
          node --check lib/index.js
          node --check lib/activity.js
          node --check lib/client.js
      - name: Fold tests
        run: node --test tests/activity.test.mjs
